server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. nginx resolves a `proxy_pass` hostname only
    # once, at startup, and then caches that IP forever. Recreating the API
    # container gives it a *new* IP, so the cached one starts refusing connections 
    # and every /api call answers 502 Bad Gateway until nginx itself is restarted.
    # Using a variable in `proxy_pass` forces nginx to re-resolve per request
    # through this resolver, so redeploys never break signup/login again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        try_files $uri$uri/ /index.html;
    }

    location /api {
        # No URI part on proxy_pass => the original request URI is forwarded
        # unchanged (/api/v1/auth/signup -> http://backend:4000/api/v1/auth/signup).
        set $api_upstream http://backend:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        set $health_upstream http://backend:4000;
        proxy_pass $health_upstream;
    }

    location /ready {
        set $ready_upstream http://backend:4000;
        proxy_pass $ready_upstream;
    }
}