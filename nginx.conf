events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # استخدام الـ DNS الداخلي لـ Docker للتعامل مع الروابط الخارجية
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # توجيه مسارات الـ API مباشرة لرابط الـ Backend الفعلي على Railway
        location /api {
            set $backend_url https://backend-production-ea96.up.railway.app;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-production-ea96.up.railway.app;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_server_name on;
        }

        location /health {
            set $health_url https://backend-production-ea96.up.railway.app;
            proxy_pass $health_url;
            proxy_ssl_server_name on;
        }

        location /ready {
            set $ready_url https://backend-production-ea96.up.railway.app;
            proxy_pass $ready_url;
            proxy_ssl_server_name on;
        }
    }
}