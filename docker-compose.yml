# LearnPilot — full stack (postgres + api + web)
# Run: docker compose up -d --build  →  Web: http://localhost:3000  API: http://localhost:4000/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-learnpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnpilot -d learnpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learnpilot-server
    # Pass the AI provider keys / RAG (HuggingFace) settings into the container.
    # The explicit `environment` block below wins over any duplicate key here,
    # so DATABASE_URL keeps pointing at the postgres service, not the host.
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnpilot}:${POSTGRES_PASSWORD:-learnpilot_dev}@postgres:5432/${POSTGRES_DB:-learnpilot}?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-use-a-long-random-string}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production-use-another-long-random-string}
      AUTH_RATE_LIMIT_MAX: 200
      # The Ollama daemon can run on the host (dev) or on a remote free VPS
      # (Oracle Always Free + Tailscale). Overridable from server/.env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
      # Same-origin API base: the browser calls :3000/api/* and nginx proxies
      # it to the server container, so the deployment works from any host
      # (no absolute localhost:4000 baked into the bundle).
      args:
        VITE_API_URL: /api/v1
    container_name: learnpilot-web
    # nginx renders nginx.conf.template at start-up and proxies /api/* here, so the
    # browser stays same-origin (no CORS, no absolute backend URL in the bundle).
    environment:
      BACKEND_URL: http://server:4000
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data: